# Mindlet API stack — paths are relative to mindlet-api/.
# Included from mindlet-app/compose.yml. Regenerate: node tools/render-service-deploys.cjs
#
# Build (sequential npm ci to avoid registry timeouts):
#   npm run docker:up
# Or from monorepo root:
#   bash mindlet-api/tools/docker-up-from-root.sh
include:
  - path: infra/platform/compose.yaml
  - path: apps/auth/compose.yaml
  - path: apps/user/compose.yaml
  - path: apps/subscription/compose.yaml
  - path: apps/payment/compose.yaml
  - path: apps/notification/compose.yaml
  - path: apps/course/compose.yaml
  - path: apps/ai/compose.yaml
  - path: apps/team/compose.yaml
  - path: apps/lesson/compose.yaml
  - path: apps/analytics/compose.yaml
  - path: apps/deck/compose.yaml
  - path: apps/test/compose.yaml
  - path: apps/storage/compose.yaml
  - path: apps/gateway-web/compose.yaml
