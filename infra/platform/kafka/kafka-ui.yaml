apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: mindlet
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: mindlet
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: kafka-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: mindlet
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: mindlet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/part-of: mindlet
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: mindlet-local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: mindlet
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: mindlet
spec:
  ingressClassName: nginx
  rules:
    - host: kafka-ui.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
