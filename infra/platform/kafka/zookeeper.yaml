apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: mindlet
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: mindlet
spec:
  clusterIP: None
  ports:
    - name: client
      port: 2181
      targetPort: 2181
  selector:
    app.kubernetes.io/name: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: mindlet
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: mindlet
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: mindlet
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.2.15
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
