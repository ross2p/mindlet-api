worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Each container listens on internal port 3000 (mapped to host 3002–3012).
    upstream auth_upstream { server auth:3000; }
    upstream user_upstream { server user:3000; }
    upstream token_upstream { server token:3000; }
    upstream subscription_upstream { server subscription:3000; }
    upstream payment_upstream { server payment:3000; }
    upstream notification_upstream { server notification:3000; }
    upstream course_upstream { server course:3000; }
    upstream ai_upstream { server ai:3000; }
    upstream team_upstream { server team:3000; }
    upstream lesson_upstream { server lesson:3000; }
    upstream analytics_upstream { server analytics:3000; }

    # WS for real-time (Yjs) on lesson: configure path + Upgrade when implemented

    server {
        listen 80;

        location /svc/auth/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/user/ {
            proxy_pass http://user_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/token/ {
            proxy_pass http://token_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/subscription/ {
            proxy_pass http://subscription_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/payment/ {
            proxy_pass http://payment_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/notification/ {
            proxy_pass http://notification_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/course/ {
            proxy_pass http://course_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/ai/ {
            proxy_pass http://ai_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/team/ {
            proxy_pass http://team_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/lesson/ {
            proxy_pass http://lesson_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /svc/analytics/ {
            proxy_pass http://analytics_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
